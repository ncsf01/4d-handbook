<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Manual do Iniciante em 4D{% endblock %}</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">
                <svg width="40" height="36" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="50,8 86,29 86,71 50,92 14,71 14,29" fill="#ffffff" stroke="#000000"
                        stroke-width="8" stroke-linejoin="round" />
                    <text x="50" y="62" fill="#000000" font-family="'Courier New', Courier, monospace"
                        font-weight="900" font-size="32" text-anchor="middle">4D</text>
                </svg>
                <span>Manual 4D</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'home' %}active{% endif %}"
                            href="{{ url_for('home') }}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'sobre' %}active{% endif %}"
                            href="{{ url_for('sobre') }}">Sobre</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'contato' %}active{% endif %}"
                            href="{{ url_for('contato') }}">Contato</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    {% block conteudo %}{% endblock %}

    <footer class="py-3 text-center">
        <p class="mb-0">&copy; 2026 Manual do Iniciante em 4D</p>
        <p class="mb-0">Nícolas César Silva Ferreira &middot; Atividade 3 &ndash; Flask na AWS EC2 &middot; DSM &ndash; FATEC</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block scripts %}{% endblock %}
</body>

</html>
